name: Question
description: Ask about SDK behavior, supported MCP features, or integration guidance.
title: "[Question]: "
body:
  - type: input
    id: version
    attributes:
      label: SDK version or commit
      placeholder: 1.0.0 or full commit SHA
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Question
      description: Include the goal, relevant code, and protocol or transport context.
    validations:
      required: true
  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
    validations:
      required: false
