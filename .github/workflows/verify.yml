name: Verify

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tier-node22:
    name: Tier evidence (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 22
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify deterministic release artifact
        run: pnpm run check:release-artifact

      - name: Run package health and full conformance
        run: pnpm run verify

      - name: Upload immutable Tier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tier1-evidence-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            .local/readiness-evidence/**
            .local/conformance/**
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

  package-health-node24:
    name: Package health (Node 24)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node 24
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install SDK dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Verify deterministic release artifact
        run: pnpm run check:release-artifact

      - name: Verify package
        run: node scripts/verify.mjs --package-health
