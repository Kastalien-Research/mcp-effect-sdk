name: Sync Tier Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/labels.json
      - scripts/sync-github-labels.mjs
      - .github/workflows/labels.yml

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sync exact Tier label taxonomy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-github-labels.mjs --apply
